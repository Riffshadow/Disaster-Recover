vrrp_script chk_web {
    script "/usr/local/bin/check_web.sh"
    interval 3
}

vrrp_instance VI_1 {
    state BACKUP
    interface enp0s3
    virtual_router_id 51
    priority 100
    advert_int 1

    authentication {
        auth_type PASS
        auth_pass 1234
    }

    virtual_ipaddress {
        192.168.0.100
    }

    track_script {
        chk_web
    }
}
